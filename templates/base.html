<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{{ config.description }}">

  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/favicon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="WumboLabs">
  <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}">
  <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock og_description %}">
  <meta property="og:url" content="https://wumbocore.com">
  <meta property="og:image" content="https://wumbocore.com/img/wumbolabs-card.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}{{ config.title }}{% endblock twitter_title %}">
  <meta name="twitter:description" content="{% block twitter_description %}{{ config.description }}{% endblock twitter_description %}">
  <meta name="twitter:image" content="https://wumbocore.com/img/wumbolabs-card.png">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="/" aria-label="WumboLabs home">
        <img class="brand-mark" src="/img/wumbolabs-mark.png" alt="" aria-hidden="true">
        <span>WumboLabs</span>
      </a>
      <div class="nav-links">
        <a href="/projects/">Projects</a>
        <a href="/lab-notes/">Lab Notes</a>
        <a href="/benchmarks/">Benchmarks</a>
        <a href="/about/">About</a>
        <a href="/contact/">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <p class="footer-brand">
          <img class="footer-mark" src="/img/wumbolabs-mark.png" alt="" aria-hidden="true">
          <strong>WumboLabs</strong>
          <span class="version">v0.07</span>
        </p>
        <p>Real hardware. Real testing. No hype.</p>
        <p>Built with Zola. Hosted on Cloudflare Pages.</p>
      </div>

      <div class="footer-links">
        <a href="/projects/">Projects</a>
        <a href="/lab-notes/">Lab Notes</a>
        <a href="https://github.com/RIPPERONInCHEEZ/wumbolabs">GitHub</a>
      </div>
    </div>
  </footer>
</body>
</html>
