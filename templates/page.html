{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ config.title }}{% endblock title %}

{% block content %}
<section class="container">
  {% if page.extra.back_url %}
    <p class="page-back">
      <a href="{{ get_url(path=page.extra.back_url) }}">← {{ page.extra.back_label | default(value="Back") }}</a>
    </p>
  {% endif %}

  <h1>{{ page.title }}</h1>
  {{ page.content | safe }}
</section>
{% endblock content %}
