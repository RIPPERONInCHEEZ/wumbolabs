{% extends "base.html" %}

{% block title %}Labs compatibility | {{ config.title }}{% endblock title %}

{% block content %}
<section class="container page-record context-page">
  <div class="console-record-bar" aria-label="Record context">
    <span><span class="operator-signal" aria-hidden="true"></span> WUMBOLABS / LABS</span>
    <span>COMPATIBILITY ROUTE / SEE LAB RECORDS</span>
  </div>
  <p class="console-record-path">
    <span class="operator-prompt" aria-hidden="true">wl@lab:~$</span>
    <span>/labs</span>
  </p>

  <header class="page-record-header">
    <h1>Continue to Lab Records</h1>
  </header>

  <div class="page-record-content">
    {{ section.content | safe }}
  </div>
</section>
{% endblock content %}
